<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌹 Недосказанность</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #160008, #4a0015, #120008);
  color: white;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
}

.card {
  width: 100%;
  max-width: 420px;
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.15);
  border-radius: 25px;
  padding: 30px 20px;
  text-align: center;
  box-shadow: 0 10px 40px rgba(0,0,0,0.4);
}

h1 {
  font-size: 28px;
  margin-bottom: 30px;
}

.question {
  font-size: 22px;
  margin-bottom: 25px;
}

button {
  width: 100%;
  padding: 15px;
  margin: 8px 0;
  border: none;
  border-radius: 15px;
  background: #ff2d55;
  color: white;
  font-size: 17px;
  cursor: pointer;
}

button:active {
  transform: scale(0.97);
}

#result {
  display: none;
  font-size: 18px;
  line-height: 1.6;
}

.heart {
  position: fixed;
  bottom: -20px;
  animation: float 5s linear infinite;
  opacity: 0.7;
}

@keyframes float {
  0% {
    transform: translateY(0) scale(1);
    opacity: 0;
  }
  20% {
    opacity: 0.8;
  }
  100% {
    transform: translateY(-110vh) scale(1.5);
    opacity: 0;
  }
}
</style>
</head>

<body>

<div class="card">

  <h1>🌹 Недосказанность</h1>

  <div id="quiz">

    <div id="question" class="question"></div>

    <div id="answers"></div>

  </div>

  <div id="result">
    <h2>❤️ Izox</h2>
    <p>
      Men sizni ozizni kozizni korb sevib qoldim
      shuchun shu sayt orqali bilb olish uchun
      yasab szga tashadm..)
    </p>
  </div>

</div>

<script>

const questions = [
  {
    q: "qalesiz yaxshimisz",
    a: ["xa yaxshi", "unchalik emas"]
  },
  {
    q: "men bn atnasheniya qilasizmi ?",
    a: ["xa", "yoq", "blmadm"]
  }
];

let current = 0;
let answers = [];

function showQuestion() {

  document.getElementById("question").innerText =
    questions[current].q;

  const box = document.getElementById("answers");
  box.innerHTML = "";

  questions[current].a.forEach(answer => {

    const btn = document.createElement("button");

    btn.innerText = answer;

    btn.onclick = () => {

      answers.push({
        question: questions[current].q,
        answer: answer
      });

      current++;

      if (current < questions.length) {
        showQuestion();
      } else {
        document.getElementById("quiz").style.display = "none";
        document.getElementById("result").style.display = "block";
      }

    };

    box.appendChild(btn);

  });
}

showQuestion();

function createHeart() {

  const heart = document.createElement("div");

  heart.className = "heart";
  heart.innerText = "❤️";

  heart.style.left = Math.random() * 100 + "vw";
  heart.style.fontSize = (15 + Math.random() * 20) + "px";

  document.body.appendChild(heart);

  setTimeout(() => heart.remove(), 5000);
}

setInterval(createHeart, 700);

</script>

</body>
</html>
